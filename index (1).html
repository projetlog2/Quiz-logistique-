function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function accId(pre,nom){return norm(pre)+"."+norm(nom)}
async function sha(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function rnd(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function remember(id){try{if(id)localStorage.setItem("quiz_compte",id);else localStorage.removeItem("quiz_compte")}catch(e){}}

var CCOL=["#f77f00","#1f9d63","#4361ee","#f7c948","#d64545","#c3a4f2","#7cc4f5","#ff8fab","#ffffff"];
function confettis(nb){
  var f=fxLayer();if(!f)return;
  for(var n=0;n<nb;n++){var c=document.createElement("i");c.className="cf"+(Math.random()<.65?"":" s"+(2+Math.floor(Math.random()*3)));
    c.style.left=(Math.random()*100)+"%"; c.style.background=CCOL[n%CCOL.length];
    c.style.setProperty("--dx",(Math.random()*200-100)+"px"); c.style.setProperty("--rot",(360+Math.random()*720)+"deg");
    c.style.animationDuration=(2.6+Math.random()*2.4)+"s"; c.style.animationDelay=(Math.random()*1.2)+"s";
    f.appendChild(c)}

}
function canons(){
  var f=fxLayer(); if(!f||!f.animate)return; var vh=window.innerHeight||700;
  [0,1].forEach(function(side){
    for(var n=0;n<46;n++){
      var c=document.createElement("i"); c.className="cf cb s"+(1+Math.floor(Math.random()*4));
      c.style.background=CCOL[Math.floor(Math.random()*CCOL.length)]; c.style[side?"right":"left"]="6px";
      var vx=(side?-1:1)*(70+Math.random()*300), vy=Math.min(vh*.9,260+Math.random()*340), r=(side?-1:1)*(300+Math.random()*700);
      f.appendChild(c);
      var an=c.animate([
        {transform:"translate(0,0) rotate(0deg)",opacity:1,easing:"cubic-bezier(.15,.8,.35,1)"},
        {transform:"translate("+(vx*.62)+"px,"+(-vy)+"px) rotate("+(r*.55)+"deg)",opacity:1,offset:.38,easing:"cubic-bezier(.55,0,.85,.6)"},
        {transform:"translate("+vx+"px,60px) rotate("+r+"deg)",opacity:.9}
      ],{duration:2300+Math.random()*1500,delay:Math.random()*260,fill:"forwards"});
      an.onfinish=(function(el){return function(){el.remove()}})(c);

function parade(list){
  if(!$("re"))return; var f=fxLayer();if(!f)return;
  list.forEach(function(h,k){
    var d=document.createElement("div");d.className="dn";
    d.style.bottom="calc("+(10+(k%2)*54)+"px + env(safe-area-inset-bottom,0px))";

function starSvg(on,k){return '<svg class="star'+(on?' on':'')+'" style="--k:'+k+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.9 7.5.7-5.7 4.9 1.7 7.3L12 18l-6.5 3.8 1.7-7.3L1.5 9.6 9 8.9z"/></svg>'}
function countUp(to){
  var el=$("sc"); if(!el)return;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce||to<=0){el.textContent=to;return}
  var t0=null, d=1300;
  function f(t){var e=$("sc"); if(!e)return; if(t0===null)t0=t; var p=Math.min(1,(t-t0)/d); e.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
function end(){
  var tot=totalPts(run), r=tot?score/tot:0, m=r===1?"Expert logistique\u00a0!":r>=.7?"Très bon résultat":r>=.4?"Pas mal, continue\u00a0!":"Encore un essai\u00a0?";

   '<div class="stars">'+[0,1,2].map(function(k){return starSvg(k<ns,k)}).join("")+'</div>'+
   '<div class="eyebrow">'+(curParty?esc(curParty.name):"Résultat")+'</div><h1 class="title">'+m+'</h1>'+
   '<div class="score"><span id="sc">0</span><small> / '+tot+'</small></div><div class="pct">'+pc+' % de réussite</div></div>'+
   '<h3 class="sect">Classement</h3><div class="note" id="board">Chargement du classement…</div>'+
   '<div class="row" style="justify-content:center"><button class="btn" id="re">Rejouer</button><button class="btn ghost" id="mn">Menu d’accueil</button></div></div>';
  $("re").onclick=function(){play(curParty)}; $("mn").onclick=start;
  countUp(score);
  setTimeout(function(){if($("re")){confettis(30+ns*20);if(ns>=2)canons()}},450);
  saveScore().then(loadBoard);
}

    if(it.vf){var vr=el('<div><label>Bonne réponse</label><select><option value="Vrai">Vrai</option><option value="Faux">Faux</option></select></div>');var vs=vr.querySelector("select");vs.value=it.a[0]==="Faux"?"Faux":"Vrai";vs.onchange=function(){it.a=vs.value==="Vrai"?["Vrai","Faux"]:["Faux","Vrai"]};box.appendChild(vr)}
    if(!it.vf){
      var cN=Math.max(1,Math.min(it.c||1,it.a.length)); it.c=cN;
      it.a.forEach(function(txt,k){

        if(it.a.length>2){var dl=document.createElement("button");dl.className="btn ghost sm";dl.textContent="Retirer cette réponse";

      if(it.a.length<8){var ad=document.createElement("button");ad.className="btn ghost sm";ad.style.marginTop="10px";ad.textContent="+ Ajouter une réponse";ad.onclick=function(){it.a.push("");renderEditor("")};box.appendChild(ad)}

function saveEditor(){
  var clean=draft.filter(function(x){return x.q.trim()}).map(function(x){if(x.vf){var v=x.a[0]==="Faux"?"Faux":"Vrai";return ml(x,{q:x.q.trim(),vf:true,a:v==="Vrai"?["Vrai","Faux"]:["Faux","Vrai"]})}return ml(x,{q:x.q.trim(),a:x.a.map(function(s){return (s||"").trim()})})});

/* ---------- Base de données Firebase (Realtime Database, via REST) ---------- */
var FB_URL="https://logistique-quiz-default-rtdb.firebaseio.com";
function fbKey(k){return encodeURIComponent(k).replace(/\./g,"%2E")}
function fbUnkey(k){try{return decodeURIComponent(k)}catch(e){return k}}
function fbUrl(p){return FB_URL+"/d/"+p.split("/").map(function(x){return encodeURIComponent(fbKey(x))}).join("/")+".json"}
function fbCall(method,path,body){
  var o={method:method};
  if(body!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(body)}
  return fetch(fbUrl(path),o).then(function(r){
    if(!r.ok)throw {message:"Firebase "+r.status};
    return r.json();
  });
}
function fbDocSnap(id,val){return {id:id,exists:val!=null,data:function(){return val==null?undefined:val}}}
function fbColSnap(raw){
  var docs=[];
  if(raw&&typeof raw==="object"){
    Object.keys(raw).forEach(function(k){
      var v=raw[k]; if(v==null)return;
      docs.push({id:fbUnkey(k),exists:true,data:function(){return v}});
    });
  }
  return {docs:docs,empty:!docs.length,size:docs.length,raw:raw};
}
function fbListen(getFn,cb){
  var last=null,dead=false,timer=null;
  function tick(){
    if(dead)return;
    getFn().then(function(snap){
      var sig=JSON.stringify(snap.raw===undefined?null:snap.raw);
      if(sig!==last){last=sig;if(!dead)cb(snap)}
    }).catch(function(){}).then(function(){
      if(!dead)timer=setTimeout(tick,(typeof document!=="undefined"&&document.hidden)?6000:1500);
    });
  }
  tick();
  return function(){dead=true;clearTimeout(timer)};
}
function fbQuery(coll,filters){
  var q={
    where:function(f,op,v){return fbQuery(coll,filters.concat([[f,v]]))},
    get:function(){
      return fbCall("GET",coll).then(function(raw){
        var snap=fbColSnap(raw);
        snap.docs=snap.docs.filter(function(d){var x=d.data();return filters.every(function(f){return x[f[0]]===f[1]})});
        snap.empty=!snap.docs.length;snap.size=snap.docs.length;
        return snap;
      });
    },
    onSnapshot:function(cb){
      return fbListen(function(){return q.get().then(function(sn){sn.raw=sn.docs.map(function(d){return [d.id,d.data()]});return sn})},cb);
    }
  };
  return q;
}
function makeDb(){
  return {
    doc:function(path){
      var id=path.split("/").pop();
      return {
        get:function(){return fbCall("GET",path).then(function(v){return fbDocSnap(id,v)})},
        set:function(d){return fbCall("PUT",path,d)},
        update:function(d){return fbCall("PATCH",path,d)},
        delete:function(){return fbCall("DELETE",path)},
        onSnapshot:function(cb){
          return fbListen(function(){return fbCall("GET",path).then(function(v){var sn=fbDocSnap(id,v);sn.raw=v;return sn})},cb);
        }
      };
    },
    collection:function(name){return fbQuery(name,[])}
  };
}

(async function(){
  try{
    var db=makeDb();
    try{await fbCall("GET","ping")}catch(e){window.dbErr=(e&&e.message)||String(e);dbState="off";if(view==="auth")authView("");return}
    dbRoot=db; dbState="ok";
    dbMain=db.doc("quiz/main");
    dbMain.onSnapshot(function(s){var d=s.exists&&s.data(),it=d&&lire(d.items);if(it&&it.length)QUESTIONS=d.vf?it:it.concat(VFDEF.map(cp));refresh()});
    db.collection("parties").onSnapshot(function(snap){
      PARTIES=snap.docs.map(function(d){var x=d.data();return {id:d.id,name:x.name,max:x.max||0,etat:x.etat||"lancee",chef:x.chef||"",t:x.t||0,items:lire(x.items)||[]}}).sort(function(a,b){return a.t-b.t});
      if(pendingHash&&ME){pendingHash=false;fromHash()}else refresh();
    });
    var id=null; try{id=localStorage.getItem("quiz_compte")}catch(e){}
    if(id){try{var sn=await db.doc("accounts/"+id).get(),d=sn.exists&&sn.data();if(d)ME={id:id,prenom:d.prenom,nom:d.nom,role:d.role||"eleve"}}catch(e){}}
    if(ME){await loadPersos();afterLogin()}else authView("");
  }catch(e){dbState="off";if(view==="auth")authView("")}
})();
